<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Flexbox - Caso 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        .contenedor {
            width: 300px;
            display: flex;
            background-color: #ddd;
            border: 2px solid #333;
            margin-bottom: 30px;
        }

        .hijo {
            height: 60px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Caso 2: Proporciones */
        .a {
            flex: 1;
            background-color: #9b59b6;
        }

        .b {
            flex: 2;
            background-color: #f1c40f;
            color: #333;
        }
    </style>
</head>

<body>

    <h2>Caso 2: flex: 1 y flex: 2 (Total 300px)</h2>
    <p>Hijo A recibe 1/3 (100px) y Hijo B recibe 2/3 (200px).</p>
    <div class="contenedor">
        <div class="hijo a">A (flex: 1)</div>
        <div class="hijo b">B (flex: 2)</div>
    </div>

</body>

</html>
