<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Resumen Presupuesto Grid</title>
  <style>
    /* Estilos generales de la página */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: white;
    }

    /* Sección contenedora del resumen */
    .resumen-presupuesto h2 {
      margin-bottom: 16px;
      color: black;
    }

    /* Rejilla CSS Grid responsiva sin media queries */
    .contenedor-tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    /* Estilo de cada tarjeta individual */
    .tarjeta-resumen {
      display: flex;
      flex-direction: column;
      padding: 16px;
      border: 1px solid gray;
      border-radius: 8px;
      background-color: lightgray;
    }

    /* Estilos del texto */
    .tarjeta-resumen .etiqueta {
      font-weight: bold;
      color: black;
      margin-bottom: 8px;
    }

    .tarjeta-resumen .monto {
      font-weight: bold;
      color: black;
    }
  </style>
</head>
<body>

  <!-- Sección de Resumen -->
  <section class="resumen-presupuesto">
    <h2>Resumen</h2>
    
    <div class="contenedor-tarjetas">
      <!-- Tarjeta Subtotal -->
      <div class="tarjeta-resumen">
        <span class="etiqueta">SUBTOTAL</span>
        <span class="monto">RD$ 18,500.00</span>
      </div>

      <!-- Tarjeta ITBIS -->
      <div class="tarjeta-resumen">
        <span class="etiqueta">ITBIS (18 %)</span>
        <span class="monto">RD$ 2,160.00</span>
      </div>

      <!-- Tarjeta Total -->
      <div class="tarjeta-resumen">
        <span class="etiqueta">TOTAL</span>
        <span class="monto">RD$ 20,660.00</span>
      </div>
    </div>
  </section>

</body>
</html>
